<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Up Something New...</title>
    <style>
        /* Light, notebook-style background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfbf7;
            /* Creates a subtle sketchbook grid */
            background-image: 
                linear-gradient(#e1e1e1 1px, transparent 1px),
                linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents scrolling on mobile while drawing */
        }

        /* Container for the text, layered on top */
        .text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Allows the mouse to click "through" the text so you can draw anywhere */
            pointer-events: none; 
            z-index: 10;
        }

        /* Colorful, gradient text */
        h1 {
            font-size: 6rem;
            margin: 0;
            /* Rainbow gradient */
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 5s ease infinite;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }

        p {
            font-size: 1.5rem;
            color: #555;
            background: rgba(253, 251, 247, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The drawing canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <!-- The text that floats in the center -->
    <div class="text-container">
        <h1>Coming Soon!</h1>
        <p>We're still coloring in the lines. Draw something while you wait!</p>
    </div>

    <!-- The blank canvas for drawing -->
    <canvas id="drawCanvas"></canvas>

    <!-- The magic that makes the drawing work -->
    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        // Make canvas fill the screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hue = 0; // Starts at red

        function draw(e) {
            if (!isDrawing) return;
            
            // Set up the rainbow brush
            ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`; 
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 12; // Thickness of the brush

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            
            // Handle both mouse and touch coordinates
            const x = e.offsetX !== undefined ? e.offsetX : e.touches[0].clientX;
            const y = e.offsetY !== undefined ? e.offsetY : e.touches[0].clientY;
            
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
            
            // Cycle through the rainbow colors
            hue++;
            if (hue >= 360) {
                hue = 0;
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // Touch Events for Mobile
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Stops the page from scrolling while drawing
            draw(e);
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        // Fix canvas size if window is resized
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
